name: CI - Tô no Sarro!

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint (eslint if exists)
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint . --ext .js,.jsx || true
          else
            echo "No eslint config, skipping"
          fi

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check paineis (build + empacotar)
        run: npm run check:paineis || echo "check:paineis failed, but build OK"

      - name: Docker build test
        run: docker build -t to-no-sarro:test .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit
        run: npm audit --audit-level=high || true
